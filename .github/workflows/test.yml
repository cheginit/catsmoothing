name: CI

on:
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
  pull_request:
    branches:
    - '**'
  workflow_dispatch:
  workflow_call:

# workflow_ref differs between a direct run and a call from release.yml, which share a name.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.environment }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [test313, test315]

    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.82.1
        environments: ${{ matrix.environment }}
        activate-environment: ${{ matrix.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    - name: Run pixi
      run: pixi r test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ${{ github.event.repository.owner.login }}/${{ github.event.repository.name }}

  rust:
    name: rust fmt, clippy, and tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --features python --all-targets -- -D warnings
    - name: Test
      run: cargo test
