name: CI

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
  workflow_call:

# workflow_ref differs between a direct run and a call from release.yml, which share a name.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.environment }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [test313, test315]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
      with:
        pixi-version: v0.82.1
        environments: ${{ matrix.environment }}
        activate-environment: ${{ matrix.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    - name: Run pixi
      run: pixi r test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ${{ github.event.repository.owner.login }}/${{ github.event.repository.name }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --features python --all-targets -- -D warnings
    - name: Test
      run: cargo test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
      with:
        pixi-version: v0.82.1
        environments: typecheck
    - run: pixi r -e typecheck typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
      with:
        pixi-version: v0.82.1
        environments: lint
    - run: pixi r -e lint lint
    # Needs network: resolves the runtime dependencies from PyPI and checks advisories.
    - run: pixi r -e lint audit
