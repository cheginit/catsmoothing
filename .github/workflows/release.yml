name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
  release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        fetch-depth: 0
        persist-credentials: false
    # checkout can leave the tag lightweight (actions/checkout#882), dropping the release summary.
    - if: startsWith(github.ref, 'refs/tags/')
      run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
    # A pre-release gets its tag message, a release with a CHANGELOG.md section gets that
    # section, and any other release gets git-cliff's notes (tag_pattern matches only vX.Y.Z).
    - id: kind
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version="${GITHUB_REF_NAME#v}"
        if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
        elif grep -q "^## \[${version}\]" CHANGELOG.md; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          awk -v head="## [${version}]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-notes.md
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "cliff=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: orhun/git-cliff-action@v4
      if: startsWith(github.ref, 'refs/tags/') && steps.kind.outputs.cliff == 'true'
      with:
        version: v2.14.2  # same as the dev environment's git-cliff
        config: pyproject.toml
        args: --latest --strip all
      env:
        OUTPUT: release-notes.md
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # A rerun edits the release that the first run created.
    - if: startsWith(github.ref, 'refs/tags/')
      run: |
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
        else
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --prerelease="$PRERELEASE"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ steps.kind.outputs.prerelease }}
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
        - runner: ubuntu-22.04
          target: x86_64
        - runner: ubuntu-22.04
          target: x86
          interpreter: python3.13 python3.14 python3.15 python3.15t
        - runner: ubuntu-22.04
          target: aarch64
        - runner: ubuntu-22.04
          target: armv7
          interpreter: python3.13 python3.14
        - runner: ubuntu-22.04
          target: s390x
        - runner: ubuntu-22.04
          target: ppc64le
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --out dist ${{ matrix.platform.interpreter && format('-i {0}', matrix.platform.interpreter) || '--find-interpreter' }}
        sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        manylinux: auto
    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-linux-${{ matrix.platform.target }}
        path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
        - runner: ubuntu-22.04
          target: x86_64
        - runner: ubuntu-22.04
          target: x86
          interpreter: python3.13 python3.14
        - runner: ubuntu-22.04
          target: aarch64
        - runner: ubuntu-22.04
          target: armv7
          interpreter: python3.13 python3.14
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --out dist ${{ matrix.platform.interpreter && format('-i {0}', matrix.platform.interpreter) || '--find-interpreter' }}
        sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        manylinux: musllinux_1_2
    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-musllinux-${{ matrix.platform.target }}
        path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
        - runner: windows-latest
          target: x64
          python_arch: x64
        - runner: windows-latest
          target: x86
          python_arch: x86
        - runner: windows-11-arm
          target: aarch64
          python_arch: arm64
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: ${{ matrix.platform.python_arch }}
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --out dist --find-interpreter
        sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-windows-${{ matrix.platform.target }}
        path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
        - runner: macos-15-intel
          target: x86_64
        - runner: macos-latest
          target: aarch64
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --out dist --find-interpreter
        sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-macos-${{ matrix.platform.target }}
        path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v6
      with:
        name: wheels-sdist
        path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [release-notes, linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
    - uses: actions/download-artifact@v7
    - name: Generate artifact attestation
      uses: actions/attest@v4
      with:
        subject-path: wheels-*/*
    - name: Install uv
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: astral-sh/setup-uv@v7
    - name: Publish to PyPI
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: uv publish 'wheels-*/*'
