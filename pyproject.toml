[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.4,<2" ]

[project]
name = "catsmoothing"
version = "0.5.0"
description = "Smoothing Shapely geometries using Catmull-Rom spline"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Taher Chegini", email = "cheginit@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = [ "numpy>=2", "shapely>=2" ]
urls.Changelog = "https://github.com/cheginit/catsmoothing/blob/main/CHANGELOG.md"
urls.CI = "https://github.com/cheginit/catsmoothing/actions"
urls.Documentation = "https://cheginit.github.io/catsmoothing/"
urls.Homepage = "https://github.com/cheginit/catsmoothing"
urls.Issues = "https://github.com/cheginit/catsmoothing/issues"

[dependency-groups]
dev = [
  "git-cliff",
  "ipykernel",
  "ipywidgets",
  "jupytext",
  "matplotlib",
  "nbconvert",
  { include-group = "test" },
  { include-group = "typecheck" },
]
test = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "pytest-sugar",
]
docs = [
  "mkdocstrings-python",
  "nbconvert",
  "zensical",
]
benchmark = [
  "pytest-codspeed",
]
lint = [
  "codespell",
  "pre-commit",
  "pysentry-rs",
  # pysentry resolves transitive dependencies through uv; without it, it audits only the
  # direct dependencies' lower bounds.
  "uv",
]
typecheck = [
  "pyright",
]

[tool.maturin]
module-name = "catsmoothing._catsmoothing"
# Bindings type
bindings = "pyo3"
# "extension-module" tells pyo3 we want to build an
# extension module (skips linking against libpython.so)
features = [ "pyo3/extension-module", "python" ]
# Build artifacts with the specified Cargo profile
profile = "release"

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]

[tool.pixi.dependencies]
maturin = "*"
uv = "*"

[tool.pixi.pypi-dependencies]
catsmoothing = { path = ".", editable = true }

[tool.pixi.tasks]
preinstall = "maturin develop --uv"
# Tags only a commit already on origin/main whose committed pyproject.toml and Cargo.toml
# carry the tag's version. An optional notes file becomes the tag message.
release = { cmd = "git show HEAD:pyproject.toml | grep -q '^version = \"{{ version | replace(\"v\", \"\") }}\"$' && git show HEAD:Cargo.toml | grep -q '^version = \"{{ version | replace(\"v\", \"\") }}\"$' && git fetch origin main && git merge-base --is-ancestor HEAD origin/main && git tag -a {{ version }} {% if notes %}-F {{ notes }}{% else %}-m {{ version }}{% endif %} && git push origin refs/tags/{{ version }}", args = [
  { arg = "version" },
  { arg = "notes", default = "" },
] }

[tool.pixi.feature.benchmark.tasks]
benchmark = { cmd = [ "pytest", "catsmoothing/tests", "--codspeed" ], depends-on = [ "preinstall" ] }

[tool.pixi.feature.dev.tasks]
changelog = "git cliff -c pyproject.toml --unreleased"
# After a release, prepends its notes, tag summary included, to CHANGELOG.md below the preamble.
changelog-update = "git cliff -c pyproject.toml --latest --prepend CHANGELOG.md"
# Sync the py:percent scripts to their paired notebooks.
nb-sync = "jupytext --sync docs/examples/*.py"
# Execute every notebook in place against a release build, since one of them times it.
nb-execute = { cmd = "jupyter nbconvert --to notebook --execute --inplace docs/examples/*.ipynb", depends-on = [
  "nb-build",
] }
nb-build = "maturin develop --uv --release"
# Sync, then execute: run before committing a notebook.
nb-run = { depends-on = [ "nb-sync", "nb-execute" ] }
# One-time pairing of a new .ipynb with a py:percent script.
nb-pair = "jupytext --set-formats 'ipynb,py:percent' docs/examples/*.ipynb"

[tool.pixi.feature.docs.tasks]
notebooks = "python scripts/convert_notebooks.py"
docs = { cmd = "zensical build --clean --strict", depends-on = [ "notebooks" ] }
docs-serve = { cmd = "zensical serve", depends-on = [ "notebooks" ] }

[tool.pixi.feature.lint.dependencies]
cargo-audit = "*"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files && python scripts/lint_untracked.py"
# Resolves the runtime dependencies from PyPI, as an install would, and checks them and
# Cargo.lock against the advisory databases. Needs network access.
audit = "pysentry-rs . --fail-on low --requirements-files scripts/audit-requirements.txt && cargo audit"
pcupdate = "pre-commit autoupdate"
spell = "codespell -w"

[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"
pip = "*"

[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"
pip = "*"

[tool.pixi.feature.py315.dependencies]
python = "~=3.15.0"
pip = "*"

[tool.pixi.feature.test.tasks]
test = { cmd = [
  "pytest",
  "--cov",
  "--cov-append",
  "--cov-branch",
  "--cov-report=xml",
  "--junitxml=junit.xml",
  "--durations=5",
], depends-on = [ "preinstall" ] }
report = { cmd = [ "coverage", "report" ], depends-on = [ "test" ] }
html = { cmd = [ "coverage", "html" ], depends-on = [ "report" ] }

[tool.pixi.feature.typecheck.tasks]
typecheck = { cmd = [ "pyright" ], depends-on = [ "preinstall" ] }

[tool.pixi.environments]
dev = { features = [ "dev", "py314" ] }
test313 = { features = [ "test", "py313" ] }
test315 = { features = [ "test", "py315" ] }
benchmark = { features = [ "benchmark", "py314" ] }
typecheck = { features = [ "typecheck", "py314" ] }
lint = { features = [ "lint", "py314" ], no-default-feature = true }
docs = { features = [ "docs", "py314" ], no-default-feature = true }

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [ "__pycache__", "benchmarks" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "ANN",     # pyright checks annotations
  "B905",    # zip without strict is fine
  "COM",     # ruff format places commas
  "CPY001",  # no copyright headers
  "D103",    # private helpers stay undocumented
  "D105",    # magic methods need no docstrings
  "E501",    # ruff format enforces line length
  "FBT",     # boolean arguments are fine
  "FIX",     # TODO markers are fine
  "ISC001",  # conflicts with ruff format
  "N",       # math names such as X or N are fine
  "PLC0415", # some imports belong inside functions
  "PLR0913", # options carry defaults
  "PLR2004", # numeric literals are fine
  "TC001",   # first-party typing-only imports are cheap
  "TC003",   # stdlib typing-only imports are cheap
  "TRY003",  # ValueError messages stay at the raise site
  "TRY301",  # raising inside try is fine
]
lint.per-file-ignores.".agents/skills/*/*.py" = [ "INP001" ]
lint.per-file-ignores."catsmoothing/tests/*.py" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "INP001", # tests are not a package
  # specific type error ignored
  "PGH003",
  # use of "assert"
  "S101",
]
lint.per-file-ignores."docs/**/*.py" = [ "INP001" ]
lint.per-file-ignores."docs/examples/*.{ipynb,py}" = [
  "D100",   # notebooks have no module docstring
  "EM",     # notebooks raise with inline messages
  "ERA001", # jupytext headers look like commented-out code
]
lint.per-file-ignores."scripts/*.py" = [ "INP001" ]
lint.extend-safe-fixes = [
  # module level imports
  "E402",
  # break down assert
  "PT018",
  # Move imports
  "TC",
  # absolute imports
  "TID252",
]
lint.isort.known-first-party = [ "catsmoothing" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "numpy"

[tool.codespell]
ignore-words-list = "crate,gages"
skip = "__pycache__,_build,.mypy_cache,.git,./htmlcov,cache,pixi.lock,**.ipynb,./target,./site/"

[tool.vulture]
paths = [ "catsmoothing", "conftest.py", "docs", "scripts" ]
ignore_names = [ "test_*" ]
ignore_decorators = [ "@pytest.fixture", "@pytest.mark.*" ]
# Only unused imports, unused arguments, and unreachable code reach 80% confidence.
min_confidence = 80

[tool.pyproject-fmt]
max_supported_python = "3.15"
expand_tables = [ "tool.git-cliff", "tool.pixi" ]

[tool.pyright]
typeCheckingMode = "strict"
include = [ "catsmoothing" ]
exclude = [ "**/__init__.py", "**/__pycache__", "catsmoothing/tests", "docs/" ]
reportAttributeAccessIssue = false
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false
reportUntypedFunctionDecorator = false

[tool.pytest]
ini_options.testpaths = [ "catsmoothing/tests" ]
ini_options.addopts = [
  "--import-mode=importlib",
  "-v",
]
ini_options.markers = [
  "benchmark: Tests that are benchmarks",
]
ini_options.doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL NUMBER"

[tool.coverage]
run.source = [ "catsmoothing" ]
run.omit = [ "**/__init__.py", "**/tests/*.py" ]
run.branch = true
paths.omit = [ "**/__init__.py", "**/tests/*.py" ]
paths.source = [ "catsmoothing", "*/site-packages" ]
report.omit = [ "**/__init__.py" ]
report.exclude_lines = [ "if TYPE_CHECKING:" ]
report.ignore_errors = true

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "kernelspec,jupytext"
cell_metadata_filter = "-all"

[tool.git-cliff]
[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and
this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# The tag message is the release summary; tags whose message only repeats the version skip it.
body = '''{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% if message and message | trim != version %}
{{ message | trim }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} (**breaking**){% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% else %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})){% endif %}
{%- endfor %}
{% endfor %}
'''
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Fixed" },
  { message = "^style", group = "Changed" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^Merge", skip = true },
]
protect_breaking_commits = true
# Only final versions count, so a final's notes start at the previous final, past any rc.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"

[tool.git-cliff.remote]
github.owner = "cheginit"
github.repo = "catsmoothing"
