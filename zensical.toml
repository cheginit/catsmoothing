[project]
site_name = "CatSmoothing"
site_description = "Smoothing Shapely geometries with Catmull-Rom splines."
site_url = "https://cheginit.github.io/catsmoothing/"
repo_url = "https://github.com/cheginit/catsmoothing"
repo_name = "cheginit/catsmoothing"

# No nav key: the nav mirrors docs/, so a new example notebook appears without an edit.

[project.theme]
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "content.code.copy",
  "navigation.footer",
  # docs/examples/index.md is the Examples section page, not a child of it.
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
# docs/index.md includes README.md; paths resolve from the repo root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://shapely.readthedocs.io/en/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
filters = ["!^_"]
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_source = false
signature_crossrefs = true
