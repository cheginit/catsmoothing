[package]
name = "catsmoothing-python"
version = "0.5.0"
authors = ["Taher Chegini <cheginit@gmail.com>"]
homepage = "https://github.com/cheginit/catsmoothing"
license = "MIT"
description = "Smoothing Shapely geometries using Catmull-Rom spline"
readme = "README.md"
edition = "2021"
include = ["/src", "/catsmoothing", "/LICENSE", "/AUTHORS.md", "pyproject.toml", "Cargo.toml", "Cargo.lock"]

[lib]
name = "catsmoothing"
crate-type = ["cdylib", "rlib"]
doc = false

[dependencies]
thiserror = "2"
rayon = "1"

[dependencies.numpy]
version = "0.30"
optional = true

[dev-dependencies]
approx = "0.5"
rand = { version = "0.10", features = ["std"] }
rand_distr = "0.6"

[dependencies.pyo3]
version = "0.30"
features = ["extension-module", "multiple-pymethods"]
optional = true

[features]
default = []
python = ["pyo3", "numpy"]

# Strip here, not in [tool.maturin], so CodSpeed can keep symbols with
# CARGO_PROFILE_RELEASE_STRIP=false (D-25).
[profile.release]
strip = true

# Each lint enforces a rule of the Google Rust style guide; .agents/skills/rust-style holds
# the rules no lint checks. clippy.toml configures the test exemptions.
[lints.clippy]
fn_params_excessive_bools = "warn"
missing_assert_message = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
string_add = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
